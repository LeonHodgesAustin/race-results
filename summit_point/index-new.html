})();

<script>
(function () {
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var N = D.n, STEP = D.step, LAPS = D.laps;
var INSPECT = '';
// The Spectrogram Inspector: one link on a session page, one per session on a track page.
function inspectLinks() {
  if (INSPECT) return '<a class="inspl" href="' + INSPECT + '">Open the Spectrogram Inspector</a>';
  var ins = D.inspectors || [], ids = {};
  S.sel.forEach(function (i) { var s = D.sessions[LAPS[i].session_idx]; if (s) ids[s.id] = 1; });
  var pick = ins.filter(function (x) { return ids[x.id]; });   // the sessions of the laps you picked
  return (pick.length ? pick : ins).map(function (s) { return '<a class="inspl" data-sid="' + String(s.id).replace(/"/g, '') + '" href="' + s.href + '">Spectrogram: ' + s.label + '</a>'; }).join('<br>');
}
function tAt(l, i) {   // lap time at grid index i, from the nearest sample that has one
  if (!l.t) return null;
  for (var d = 0; d < N; d++) { var a = l.t[i - d], b = l.t[i + d]; if (a != null) return a; if (b != null) return b; }
  return null;
}
function iAtT(l, t) {
  var best = null, bd = Infinity;
  for (var i = 0; i < N; i++) { var v = l.t && l.t[i]; if (v == null) continue; var d = Math.abs(v - t); if (d < bd) { bd = d; best = i; } }

}
// The Spectrogram links carry the lap, the highlighted range and the cursor, so the inspector opens on
// what you were looking at (and its way back carries them home again).
function syncInspect() {

    if (!a.dataset.base) a.dataset.base = a.getAttribute('href').split('#')[0];
    var sid = a.dataset.sid || '', li = S.sel.filter(function (i) { var s = D.sessions[LAPS[i].session_idx]; return !sid || (s && String(s.id) === sid); })[0];
    if (li == null) { a.setAttribute('href', a.dataset.base); return; }
    var l = LAPS[li], h = '#lap=' + l.lap_number;
    if (l.t) {
      if (!winIsFull()) h += '&a=' + tAt(l, S.win[0]).toFixed(2) + '&b=' + tAt(l, S.win[1]).toFixed(2);
      if (S.cur != null) h += '&c=' + tAt(l, S.cur).toFixed(2);

  var m = /;ta=([\d.]+);tb=([\d.]+)/.exec(location.hash), c = /;tc=([\d.]+)/.exec(location.hash), l = LAPS[S.sel[0]];

var HOWTO = {
  gl: 'Above zero you are accelerating, below zero you are braking. Compare laps through a braking zone or out of a corner: a clean, progressive trace is a smooth driver.',
  gt: 'How hard the car is turning. Above zero is a right-hand corner, below zero a left. Laps overlaid through one corner show where you turned in, how long you held the load and how smoothly you unwound it.',
  slip: 'How much faster the engine turns than your road speed allows in that gear. A couple of percent is normal tyre creep under power. Bigger spikes out of corners are wheelspin; with an open diff 15% is roughly one rear wheel spinning 30% faster than the road.',
  yaw: 'How much faster the car is turning than the path it is on, from the gyro. Above zero the rear may be stepping out; below zero a slide may be being caught. It reads near zero in a steady corner however sideways the car is, so it shows the moments the car moves around, not how much it slides, and a steady 1-2 deg/s through one corner can be that corner\'s banking. Read it with slip: spin with no rise in rotation can be the inside rear spinning on the open diff, but a steady slide would show nothing here either. About 1 deg/s is noise.'

var EXPLAIN = {"spd": "<p><b>What it shows.</b> Road speed in mph along the lap, every lap you've selected on top of each other. The bottom of each dip is how fast you were through that corner; where a line starts falling is where the car started slowing; how steeply it climbs afterwards is how hard the car drove out.</p><p><b>How it's measured.</b> From the GPS (ten readings a second), placed on a 2 m grid along the lap so laps line up by position on the track, not by time.</p><p><b>What good looks like.</b> A higher minimum speed in a corner, and a line that climbs earlier and keeps climbing out of it. A lap that brakes later but reaches the same minimum speed has gained the difference in the braking zone.</p><p><b>Watch for.</b> A dip in the middle of a straight is a lift. A line that flattens off at the end of a long straight has run out of revs or power. Two laps with the same minimum speed but different exits: compare the Acceleration chart there.</p><p><b>Limits.</b> GPS speed is smoothed, and it reports about a tenth of a second late. Braking shows on the Acceleration chart a few metres before the speed starts to fall; that is expected, not two different brake points.</p>", "gl": "<p><b>What it shows.</b> How hard the car is speeding up (above zero) or slowing down (below zero), in g. One g is the hardest a road car brakes; the Ford's best stops at Summit peak around 1.0 to 1.1 g.</p><p><b>How it's measured.</b> From the accelerometer in the logger, many times a second, lined up with the GPS position (the GPS delay is taken out). It includes the hill: going uphill reads slightly as braking, downhill slightly as accelerating.</p><p><b>What good looks like.</b> Braking: a fast drop to the peak (well under a quarter of a second), held there, then eased off smoothly as you turn in, so it rounds into the corner rather than stopping square. Out of the corner: steady acceleration with no gaps except short notches at each upshift.</p><p><b>Watch for.</b> A slow ramp down at the start of braking (feeling for it), a dip back toward zero in the middle of the stop (easing off, then braking again), a flat stretch near zero before turn-in (coasting), or dips below zero on the way out (a lift). The Coaching section flags all of these and what they cost.</p><p><b>Limits.</b> Kerbs and bumps add short spikes. Compare the shapes between laps rather than single values.</p>", "gt": "<p><b>What it shows.</b> How hard the car is turning, in g: above zero is a right-hander, below zero a left. The height of the plateau in a corner is how much grip you used.</p><p><b>How it's measured.</b> From the logger's accelerometer, sideways, lined up with the GPS position.</p><p><b>What good looks like.</b> A clean build at turn-in, a flat plateau through the middle at about the car's grip (around 1.2 to 1.3 g at Summit; more in banked T8 and T10), and a smooth unwind on the way out. On your best laps the plateau is higher and holds steady.</p><p><b>Watch for.</b> A notch in the middle of a corner (a correction or a lift), a saw-tooth (the wheel being worked, or the car moving around), a plateau lower than your best lap's (grip not used), or a late second rise (tightening the line after an early apex).</p><p><b>Limits.</b> Banking adds to it, so compare a corner with itself, not with other corners. The car's roll tips a little gravity into it; the calibration takes most of that out.</p>", "delta": "<p><b>What it shows.</b> How far each lap is ahead of or behind the fastest lap you've selected, at every point round the lap. The fastest lap is the flat line at zero.</p><p><b>How it's measured.</b> The time each lap took to reach each point on the track, minus the fastest lap's time to the same point.</p><p><b>How to read it.</b> Read the slope, not the value. Where a line climbs, that lap is losing time there; where it falls, it's gaining. A corner where the line steps up is where the time went; the value at the finish is the lap time difference.</p><p><b>Limits.</b> Smoothed, and good to a few hundredths of a second. A step of 0.02 s or less is within the noise.</p>", "rpm": "<p><b>What it shows.</b> Engine speed along the lap. The peaks before each upshift are your shift points; the configured shift point and maximum can be drawn on it.</p><p><b>How it's measured.</b> There's no tachometer wire. The logger has a vibration sensor bolted to the car, and the engine's firing frequency is tracked in that vibration. It's good to about one percent, checked against the tach in onboard video.</p><p><b>What good looks like.</b> Shifts made where the engine still pulls best (the Shifts card in Coaching works out where that is from your own laps), and no time spent bouncing on the rev limit.</p><p><b>Watch for.</b> Early shifts on the way out of a corner, and a flat top at the end of a straight (out of revs, so a gearing question).</p><p><b>Limits.</b> A brief spike or dip at a shift or over a kerb can be the tracker, not the engine. The Spectrogram Inspector shows the raw vibration behind it.</p>", "gear": "<p><b>What it shows.</b> Which gear the car was in along the lap, so you can see where you change up and down.</p><p><b>How it's measured.</b> Worked out from engine RPM against road speed, using the gear ratios and the tire's loaded size in car.toml. Every gear has its own ratio of RPM to speed.</p><p><b>Watch for.</b> Upshifts and downshifts in different places from lap to lap, or a gear held where the next one would pull harder (see the Shifts card).</p><p><b>Limits.</b> Gaps are the moments the clutch is in, or the engine speed doesn't match any gear (mid-shift, or wheelspin). It never guesses a gear there.</p>", "slip": "<p><b>What it shows.</b> How much faster the engine is turning than your road speed allows in that gear, in percent: how much the driven rear wheels are turning faster than the road.</p><p><b>How it's measured.</b> Engine RPM against GPS road speed in the current gear, with the tire's loaded rolling size and the GPS delay taken into account.</p><p><b>What good looks like.</b> About 0.3 to 1% on the straights (a driven tire always creeps a little), and short, small peaks out of slow corners.</p><p><b>Watch for.</b> Long stretches above about 6% out of slow corners: that's time spent spinning. With an open differential the engine sees the average of the two rear wheels, so 15% is roughly one wheel spinning 30% faster than the road (usually the inside one). Read it with Rotation: spin with no rotation is the inside wheel spinning away the drive; spin with rotation is power oversteer.</p><p><b>Limits.</b> Under braking in gear it reads about zero or a little negative (engine braking). Across a shift it is blank.</p>", "yaw": "<p><b>What it shows.</b> How fast the car's angle to its direction of travel is changing, in degrees per second. Above zero the car is rotating faster than the path it's on (the rear stepping out, or you rotating it on entry). Below zero it's rotating slower (a slide being caught, or the car straightening up as you unwind).</p><p><b>How it's measured.</b> Two turning rates compared at each instant: how fast the car's body is turning, from the gyro, and how fast its direction of travel is turning, from sideways G divided by speed. If they match the car is following its arc at a steady angle, so it reads zero however sideways the car is. The difference, added up over time, is how many degrees the car moved around (5 degrees per second for one second is about 5 degrees).</p><p><b>What good looks like.</b> A small, smooth rise at turn-in as the car points toward the apex, about zero through the middle (balanced), and a gentle dip as you unwind and put the power down. One smooth hump each way.</p><p><b>Watch for.</b> A spike up on the power followed by a sharp dip: the rear stepped out and you caught it, and the correction and the lost drive cost time. A back-and-forth wiggle: the car isn't settled. A big rise under braking before turn-in: the rear
